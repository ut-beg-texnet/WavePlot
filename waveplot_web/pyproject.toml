[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "waveplot-web"
version = "0.1.0"
description = "WavePlot: interactive web visualisation of WAVE simulation outputs (port of WavePlot v407)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "WavePlot developers" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Dash",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=2.2,<3",
    "scipy>=1.14,<2",
    "xarray>=2025.1",
    "h5netcdf>=1.4",
    "h5py>=3.12",
    "matplotlib>=3.9,<4",
    "contourpy>=1.3",
    "plotly>=6.1,<8",
    "dash[diskcache]>=3.0,<5",
    "dash-mantine-components>=2.0,<3",
    "dash-ag-grid>=31",
    "imageio-ffmpeg>=0.5",
    "cachetools>=5",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "platformdirs>=4",
    "colorcet>=3.1",
]

[project.optional-dependencies]
server = ["waitress>=3"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.6"]

[project.scripts]
waveplot = "waveplot.cli:main"

[project.entry-points."xarray.backends"]
wave = "waveplot.io.xr_backend:WaveBackendEntrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
waveplot = ["web/assets/*", "web/assets/**/*", "docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: performance budgets and long-running tests",
    "dataset_b: needs the cg11 dataset (set WAVEPLOT_TEST_DATA_B)",
]
filterwarnings = ["ignore::DeprecationWarning:dash.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["E741", "RUF001", "RUF002", "RUF003", "RUF005", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.coverage.run]
source = ["waveplot"]
omit = ["*/web/assets/*"]
